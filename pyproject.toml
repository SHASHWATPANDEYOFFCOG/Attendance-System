[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-app"
version = "0.1.0"
description = "Occlusion-robust live attendance system built on the occlubio pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"

# Core runtime. The vendored `occlubio` package is shipped in-tree (see README §Vendoring),
# so its dependencies are declared here rather than pulled from the upstream project.
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "insightface>=0.7.3",
    "onnxruntime>=1.16",
    "faiss-cpu>=1.7.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "cryptography>=42",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
# Only needed to plot the ROC curve in tools/roc.py; the numeric report works without it.
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["occlubio*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
